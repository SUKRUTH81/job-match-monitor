name: Company Career Sites

# Reads the career sites of a fixed list of companies (see PORTALS in company_portals.py) and mails
# each new opening once. It runs beside the hourly "Job Match Monitor" and does not replace it.
#
# A mail (and a phone push) goes out when a new opening is all of:
#   - in Hyderabad, Bengaluru or Chennai, or remote in India,
#   - one of the candidate's roles and full-time (the same rules as the hourly report),
#   - asking for experience that includes the candidate's years (table 1). A posting whose stated
#     experience leaves the candidate out is never listed. A posting that states no years is listed
#     apart, in table 2, and only at a skill match of min_match or more.
#
# hourly-timer.yml starts this once an hour, after it has started the job monitor.
# To start it by hand: Actions -> Company Career Sites -> Run workflow ("dry_run" sends nothing).
# To stop it: Actions -> Company Career Sites -> "..." -> Disable workflow.

on:
  workflow_dispatch:
    inputs:
      candidate_yoe:
        description: 'Candidate years of experience (default 2.0)'
        required: false
        default: '2.0'
      min_match:
        description: 'Skill match needed by a posting that states no experience, in percent (default 60)'
        required: false
        default: '60'
      companies:
        description: 'Optional comma-separated sites (ntt, amazon, cognizant, tiger, infor, jpmc, capgemini); empty = all'
        required: false
        default: ''
      dry_run:
        description: 'Scan and log only: send nothing, remember nothing'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One scan at a time; a second one waits, so the same opening is never mailed twice.
concurrency:
  group: company-portals
  cancel-in-progress: false

env:
  STATE_FILE: data/company_portal_state.json

jobs:
  scan:
    name: Scan company career sites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # What was already judged and already mailed, handed from run to run.
      - name: Restore scan history
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: company-portals-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            company-portals-v1-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Scan the career sites and mail what is new
        timeout-minutes: 30
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Who gets the mail: the JOB_ALERT_TO secret (addresses separated by commas). No address is kept here.
          JOB_ALERT_TO: ${{ secrets.JOB_ALERT_TO }}
          # Phone push (ntfy.sh): the topic is the NTFY_TOPIC secret; without it no push is sent.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Inputs go through the environment, not straight into the script text.
          INPUT_CANDIDATE_YOE: ${{ inputs.candidate_yoe || '2.0' }}
          INPUT_MIN_MATCH: ${{ inputs.min_match || '60' }}
          INPUT_COMPANIES: ${{ inputs.companies }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--candidate-yoe "$INPUT_CANDIDATE_YOE" --min-match "$INPUT_MIN_MATCH")
          if [ -n "$INPUT_COMPANIES" ]; then
            ARGS+=(--companies "$INPUT_COMPANIES")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python company_portals.py "${ARGS[@]}"

      - name: Save scan history
        # Also after a failed scan, so an opening that was mailed is never mailed twice.
        if: ${{ !cancelled() && hashFiles('data/company_portal_state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: company-portals-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
