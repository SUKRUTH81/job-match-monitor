name: Naukri Probe

# Test only. Opens one public Naukri search page in a real browser on a GitHub runner, with no
# login, and logs whether the job list can be read. Sends nothing and changes nothing.
# Run by hand: Actions -> Naukri Probe -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Open Naukri's public search
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open the search pages in a full browser
        run: xvfb-run -a python naukri_probe.py
