name: Naukri Scan

# Reads Naukri's public job search and mails each new opening once. No Naukri account is used and
# nothing is signed in to: a real browser on this runner opens one public search page a visitor
# sees. It solves no CAPTCHA; if Naukri refuses the browser, that hour is skipped and nothing is
# retried (six refused runs in a row fail the run).
# All requests come from this GitHub runner, never from the candidate's own computer.
#
# Each run reads ONE search page (the 20 newest postings of the last day). Eight searches take
# turns by the hour: Python developer and AI engineer, in Hyderabad, Bengaluru, Chennai and remote.
#
# A mail (and a phone push) goes out when a new opening is all of:
#   - in Hyderabad, Bengaluru or Chennai, or remote,
#   - one of the candidate's roles and full-time (the same rules as the hourly report),
#   - asking for experience that includes the candidate's years (Naukri states the range),
#   - a skill match of min_match or more.
#
# hourly-timer.yml starts this once an hour. To start it by hand: Actions -> Naukri Scan ->
# Run workflow ("dry_run" sends nothing). To stop it: disable the Naukri Scan workflow.

on:
  workflow_dispatch:
    inputs:
      candidate_yoe:
        description: 'Candidate years of experience (default 2.0)'
        required: false
        default: '2.0'
      min_match:
        description: 'Skill match needed, in percent (default 60)'
        required: false
        default: '60'
      turn:
        description: 'Which of the eight searches to read, 0-7 (empty = the one whose turn it is this hour)'
        required: false
        default: ''
      dry_run:
        description: 'Scan and log only: send nothing, remember nothing'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One scan at a time; a second one waits, so the same opening is never mailed twice.
concurrency:
  group: naukri-scan
  cancel-in-progress: false

env:
  STATE_FILE: data/naukri_state.json

jobs:
  scan:
    name: Scan Naukri
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # What was already judged and already mailed, handed from run to run.
      - name: Restore scan history
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: naukri-scan-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            naukri-scan-v1-${{ runner.os }}-

      - name: Install dependencies and the browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Scan Naukri and mail what is new
        timeout-minutes: 30
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Who gets the mail: the JOB_ALERT_TO secret (addresses separated by commas). No address is kept here.
          JOB_ALERT_TO: ${{ secrets.JOB_ALERT_TO }}
          # Phone push (ntfy.sh): the topic is the NTFY_TOPIC secret; without it no push is sent.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Inputs go through the environment, not straight into the script text.
          INPUT_CANDIDATE_YOE: ${{ inputs.candidate_yoe || '2.0' }}
          INPUT_MIN_MATCH: ${{ inputs.min_match || '60' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_TURN: ${{ inputs.turn }}
        run: |
          ARGS=(--candidate-yoe "$INPUT_CANDIDATE_YOE" --min-match "$INPUT_MIN_MATCH")
          if [ -n "$INPUT_TURN" ]; then
            ARGS+=(--turn "$INPUT_TURN")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          # The browser needs a display; xvfb gives it one that nobody sees.
          xvfb-run -a python naukri_scan.py "${ARGS[@]}"

      - name: Save scan history
        # Also after a failed scan, so an opening that was mailed is never mailed twice.
        if: ${{ !cancelled() && hashFiles('data/naukri_state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: naukri-scan-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
