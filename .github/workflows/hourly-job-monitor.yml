name: Job Match Monitor

on:
  schedule:
    # Triggers hourly from 8:00 AM to 11:00 PM IST (02:30 UTC to 17:30 UTC)
    - cron: '30 2-17 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Posting age window in hours'
        required: false
        default: '2'
      keywords:
        description: 'Optional comma-separated search terms (leave empty for default AI/Software/Python terms)'
        required: false
        default: ''
  push:
    paths:
      - 'data/linkedin_jobs.json'
      - 'job_match_runner.py'
      - '.github/workflows/hourly-job-monitor.yml'

permissions:
  contents: read
  issues: write

# Avoid overlapping scans and duplicate notifications if one run is slow.
concurrency:
  group: job-match-monitor
  cancel-in-progress: false

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore seen-job history
        uses: actions/cache/restore@v4
        with:
          path: data/seen_job_ids.json
          key: seen-jobs-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            seen-jobs-v2-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run job search, scoring, and notification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          LINKEDIN_JOBS_JSON: data/linkedin_jobs.json
          LINKEDIN_PROXY: ${{ secrets.LINKEDIN_PROXY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOB_ALERT_TO: ${{ secrets.JOB_ALERT_TO || 'sukruth1435@gmail.com, akhilarohithayepuri@gmail.com' }}
        run: |
          HOURS="${{ inputs.hours || (github.event_name == 'schedule' && '1' || '2') }}"
          KW_ARG=""
          if [ -n "${{ inputs.keywords }}" ]; then
            KW_ARG="--keywords ${{ inputs.keywords }}"
          fi
          python job_match_runner.py --hours $HOURS --target-count 0 --min-match 60 $KW_ARG

      - name: Save seen-job history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/seen_job_ids.json
          key: seen-jobs-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Excel report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: job-match-report-${{ github.run_id }}
          path: reports/*.xlsx
          if-no-files-found: ignore
          retention-days: 7
