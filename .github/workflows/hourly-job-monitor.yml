name: Job Match Monitor

on:
  schedule:
    # GitHub's minimum supported scheduled interval is 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/linkedin_jobs.json'
      - 'job_match_runner.py'
      - '.github/workflows/hourly-job-monitor.yml'

permissions:
  contents: read
  issues: write

# Avoid overlapping scans and duplicate notifications if one run is slow.
concurrency:
  group: job-match-monitor
  cancel-in-progress: false

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore seen-job history
        uses: actions/cache/restore@v4
        with:
          path: data/seen_job_ids.json
          key: seen-jobs-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            seen-jobs-v2-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run job search, scoring, and GitHub notification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          LINKEDIN_JOBS_JSON: data/linkedin_jobs.json
          LINKEDIN_PROXY: ${{ secrets.LINKEDIN_PROXY }}
        run: python job_match_runner.py --hours 24 --target-count 0 --min-match 60

      - name: Save seen-job history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/seen_job_ids.json
          key: seen-jobs-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Excel report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: job-match-report-${{ github.run_id }}
          path: reports/*.xlsx
          if-no-files-found: ignore
          retention-days: 7
