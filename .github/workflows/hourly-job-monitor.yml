name: Job Match Monitor

on:
  schedule:
    # Run every hour at minute 00 IST
    - cron: '30 * * * *'
  #schedule:
    # Exact hourly alignment with Indian Standard Time (IST = UTC + 5:30):
    # In UTC, 30 minutes past the hour corresponds to the exact start of the hour in IST (:00 IST).
    # 02:30 UTC = 08:00 AM IST, 03:30 UTC = 09:00 AM IST, ..., 17:30 UTC = 11:00 PM IST
    #- cron: '30 2-17 * * *'
    # Secondary mid-hour scan at :00 UTC (which is half-past every IST hour, e.g. 8:30 AM, 9:30 AM ... 10:30 PM IST)
    #- cron: '0 3-17 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Posting age window in hours (strict 1 hour)'
        required: false
        default: '1'
      keywords:
        description: 'Optional comma-separated search terms (leave empty for default AI/Software/Python terms)'
        required: false
        default: ''
      candidate_yoe:
        description: 'Candidate years of experience (default 2.0)'
        required: false
        default: '2.0'
      min_yoe:
        description: 'Minimum acceptable YOE'
        required: false
        default: '0.0'
      max_yoe:
        description: 'Maximum acceptable YOE (ceiling)'
        required: false
        default: '5.0'
      force_notify:
        description: 'Force notification issue creation even if jobs were previously seen'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - 'data/linkedin_jobs.json'
      - 'job_match_runner.py'
      - '.github/workflows/hourly-job-monitor.yml'

permissions:
  contents: read
  issues: write

# Avoid overlapping scans and duplicate notifications if one run is slow.
concurrency:
  group: job-match-monitor
  cancel-in-progress: false

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore seen-job history
        uses: actions/cache/restore@v4
        with:
          path: data/seen_job_ids.json
          key: seen-jobs-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            seen-jobs-v2-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run job search, scoring, and notification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          LINKEDIN_JOBS_JSON: data/linkedin_jobs.json
          LINKEDIN_PROXY: ${{ secrets.LINKEDIN_PROXY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOB_ALERT_TO: ${{ secrets.JOB_ALERT_TO || 'sukruth1435@gmail.com, akhilarohithayepuri@gmail.com' }}
        run: |
          HOURS="${{ inputs.hours || '1' }}"
          KW_ARG=""
          if [ -n "${{ inputs.keywords }}" ]; then
            KW_ARG="--keywords ${{ inputs.keywords }}"
          fi
          FORCE_ARG=""
          if [ "${{ inputs.force_notify }}" = "true" ]; then
            FORCE_ARG="--force-notify"
          fi
          CANDIDATE_YOE="${{ inputs.candidate_yoe || '2.0' }}"
          MIN_YOE="${{ inputs.min_yoe || '0.0' }}"
          MAX_YOE="${{ inputs.max_yoe || '5.0' }}"
          python job_match_runner.py --hours $HOURS --target-count 0 --min-match 60 --candidate-yoe $CANDIDATE_YOE --min-yoe $MIN_YOE --max-yoe $MAX_YOE $KW_ARG $FORCE_ARG

      - name: Save seen-job history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/seen_job_ids.json
          key: seen-jobs-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Excel report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: job-match-report-${{ github.run_id }}
          path: reports/*.xlsx
          if-no-files-found: ignore
          retention-days: 7
